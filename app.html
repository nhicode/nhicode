<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clien | chisato</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0d1117; --bg-darker: #161b22; --bg-card: rgba(28, 33, 40, 0.85);
            --neon-green: #00ff41; --neon-pink: #ff79c6; --neon-orange: #ffb86c;
            --text-gray: #c9d1d9; --text-dim: #8b949e; --border-color: #30363d;
        }

        body { font-family: 'JetBrains Mono', monospace; background: var(--bg-dark); color: var(--text-gray); min-height: 100vh; overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 40px 15px; position: relative; }
        
        /* MƯA TUYẾT */
        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .snowflake { position: absolute; top: -10px; color: var(--neon-green); pointer-events: none; animation: fall linear infinite; opacity: 0.4; font-size: 12px; }
        @keyframes fall { to { transform: translateY(105vh) translateX(20px) rotate(360deg); } }

        /* VIỀN CONTAINER */
        .container { 
            width: 100%; max-width: 500px; padding: 30px; text-align: center; 
            background: transparent; 
            border: 2px solid transparent;
            border-radius: 12px; 
            background-image: linear-gradient(var(--bg-dark), var(--bg-dark)), 
                              linear-gradient(135deg, var(--neon-green), var(--neon-pink));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            position: relative; z-index: 100; opacity: 0; transform: translateY(20px); transition: 1s; 
        }
        .loaded .container { opacity: 1; transform: translateY(0); }
        .card-video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.35); border-radius: 10px; }

        .profile, .links-wrapper, .code-separator, .chat-widget, .ad-wrapper { position: relative; z-index: 10; }
        
        /* AVATAR */
        .header-icon { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid var(--neon-green); animation: float 4s ease-in-out infinite; margin: 0 auto 20px; display: block; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        /* TEXT GRADIENT */
        h1, .subtitle, .code-separator, .loader-text, .link-text {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .link-text { display: inline-block; }

        h1 { font-size: 2rem; margin: 15px auto 10px; display: inline-block; }
        h1::after { content: '_'; animation: blink 1s infinite; margin-left: 5px; color: var(--neon-green); -webkit-text-fill-color: var(--neon-green); }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        
        .subtitle { font-size: 0.9rem; margin-bottom: 20px; display: inline-block;}
        .subtitle::before { content: '// '; -webkit-text-fill-color: var(--neon-pink); }
        .code-separator { margin: 25px 0; text-align: center; font-size: 0.85rem; opacity: 0.8; display: block; }

        /* NÚT BẤM LINK */
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .link-card { 
            background: rgba(22, 27, 34, 0.7); backdrop-filter: blur(4px); padding: 16px 20px; border-radius: 8px; 
            text-decoration: none; display: flex; align-items: center; border: 1px solid var(--border-color); 
            transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; font-size: 0.95rem; 
        }
        .link-card::before { content: '$ '; font-weight: 700; margin-right: 8px; color: var(--neon-green); }
        .link-card:hover { transform: translateX(5px); border-color: var(--neon-green); background: rgba(13, 17, 23, 0.9); }
        
        .link-card i { font-size: 1.2rem; margin-right: 12px; transition: transform 0.3s; width: 24px; text-align: center; }
        .link-card:hover i { transform: scale(1.2); }
        
        .link-card.ios i { color: #ffffff; }
        .link-card.android i { color: #3ddc84; }
        .link-card.windows i { color: #00a4ef; }
        .link-card.hack i { color: #ff4444; }
        .link-card.fc i { color: #2ecc71; }

        /* THÔNG BÁO TRẠNG THÁI ADS NHỎ GỌN */
        .ad-status-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid var(--neon-pink);
            color: var(--text-gray);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 99999999;
            box-shadow: 0 0 15px rgba(255, 121, 198, 0.3);
            display: none;
        }

        /* KHUNG CHỨA QUẢNG CÁO */
        .ad-wrapper {
            margin: 15px 0 5px;
            padding: 8px;
            background: rgba(13, 17, 23, 0.75);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* KHUNG NHÚNG CHAT */
        .chat-widget { width: 100%; height: 480px; margin-top: 10px; background: rgba(13, 17, 23, 0.85); border: 1px solid var(--border-color); border-radius: 8px; -webkit-overflow-scrolling: touch; }

        /* LOADING */
        #loader-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999999; transition: 0.8s; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loading-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .loader-spinner { width: 50px; height: 50px; margin: 0 auto; border: 4px solid var(--border-color); border-top: 4px solid var(--neon-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .enter-btn { 
            display: none; padding: 15px 40px; font-size: 1.2rem; font-family: 'JetBrains Mono', monospace; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; background: transparent; transition: all 0.3s ease; 
            border: 2px solid var(--neon-green); color: var(--neon-green);
            animation: neon-pulse-glow 10s infinite ease-in-out;
        }
        @keyframes neon-pulse-glow {
            0%, 100% { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.4); }
            25% { border-color: #fff; color: #fff; box-shadow: 0 0 40px var(--neon-green); }
            50% { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 121, 198, 0.4); }
            75% { border-color: #fff; color: #fff; box-shadow: 0 0 40px var(--neon-pink); }
        }
        .loaded #loader-wrapper { opacity: 0; visibility: hidden; pointer-events: none; }

        /* CLICK FX */
        .click-ripple { position: fixed; border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); animation: ripple-wave 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes ripple-wave { 0% { width: 0; height: 0; opacity: 1; border-width: 6px; } 100% { width: 220px; height: 220px; opacity: 0; border-width: 0px; } }
        .click-particle { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 9999; animation: particle-explode 0.6s forwards; }
        @keyframes particle-explode { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }
        .click-heart { position: fixed; font-size: 22px; font-weight: bold; pointer-events: none; z-index: 9999; animation: heart-float 1s ease-out forwards; }
        @keyframes heart-float { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 20% { transform: translate(-50%, -80%) scale(1.3); } 100% { transform: translate(-50%, -200px) scale(1); opacity: 0; } }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading-content').style.display = 'none'; 
                document.getElementById('enter-btn').style.display = 'block'; 
            }, 3000); 
        });

        document.getElementById('enter-btn').addEventListener('click', () => {
            document.body.classList.add('loaded');
            try { initAudio(); playClickSound(); } catch(e) {}
            const music = document.getElementById("bgMusic");
            music.muted = false; music.play().catch(e => {});
        });

        // =========================================================
        // QUẢN LÝ QUẢNG CÁO CHO MỌI NÚT LINK (TRỪ CHAT)
        // Tối đa 5 lần quảng cáo/nút -> Dừng & đợi 10s để tải lại
        // =========================================================
        const DIRECT_AD_URL = "https://arwf.org/4/24be8a4e3ef1917d9a9394c9f7c29170";
        const MAX_AD_CLICKS = 5;
        const COOLDOWN_MS = 10000; // 10 giây
        const buttonAdState = new Map();

        let toastTimer = null;
        function showAdToast(msg) {
            const el = document.getElementById('adStatusToast');
            if (!el) return;
            el.textContent = msg;
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.style.display = 'none';
            }, 2600);
        }

        function reloadBannerAd() {
            const container = document.getElementById('container-e9d611d8f447091d578dd8216bbcb2bc');
            if (!container) return;
            const oldScript = document.querySelector('script[src*="bicea.org/21/e9d611d8f447091d578dd8216bbcb2bc"]');
            if (oldScript) oldScript.remove();
            container.innerHTML = '';

            const newScript = document.createElement('script');
            newScript.async = true;
            newScript.fetchPriority = 'high';
            newScript.setAttribute('data-cfasync', 'false');
            newScript.src = 'https://bicea.org/21/e9d611d8f447091d578dd8216bbcb2bc?reload=' + Date.now();
            container.parentNode.insertBefore(newScript, container);
        }

        document.querySelectorAll('.links-wrapper .link-card').forEach((btn, idx) => {
            const key = btn.getAttribute('data-ad-btn') || `btn_${idx}`;
            const originalHref = btn.getAttribute('href');

            buttonAdState.set(key, {
                adCount: 0,
                cooldownUntil: 0,
                resetTimer: null
            });

            btn.addEventListener('click', function(e) {
                // Bỏ qua nếu bấm nhầm vào iframe chat (đã nằm ngoài .link-card)
                const state = buttonAdState.get(key);
                const now = Date.now();

                // Nếu đang trong thời gian chờ 10s sau khi đạt 5 lần quảng cáo
                if (state.cooldownUntil > now) {
                    const remainSec = Math.ceil((state.cooldownUntil - now) / 1000);
                    showAdToast(`Đã đạt giới hạn 5 ads. Tạm dừng, đợi ${remainSec}s để tải lại...`);
                    return; // Vẫn cho đi tới href bình thường mà không mở thêm ads
                }

                // Chưa đạt 5 lần -> kích hoạt quảng cáo
                if (state.adCount < MAX_AD_CLICKS) {
                    state.adCount += 1;

                    // Nếu link gốc không phải chính là link ads thì mở link ads ở tab mới
                    if (originalHref && originalHref !== '#' && originalHref !== DIRECT_AD_URL) {
                        window.open(DIRECT_AD_URL, '_blank', 'noopener,noreferrer');
                    }

                    // Nếu vừa chạm mốc lần thứ 5 -> bắt đầu đếm ngược 10s
                    if (state.adCount >= MAX_AD_CLICKS) {
                        state.cooldownUntil = now + COOLDOWN_MS;
                        showAdToast(`Nút đã đủ 5 lần ads! Dừng 10s rồi tự tải lại quảng cáo...`);

                        clearTimeout(state.resetTimer);
                        state.resetTimer = setTimeout(() => {
                            state.adCount = 0;
                            state.cooldownUntil = 0;
                            reloadBannerAd();
                            showAdToast(`Đã hết 10s — Đã tải lại quảng cáo cho nút!`);
                        }, COOLDOWN_MS);
                    }
                }
            });
        });

        let audioCtx = null;
        function initAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { audioCtx.resume(); } }
        function playClickSound() {
            try { initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = 800; osc.type = 'sine'; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1); } catch(e) {}
        }

        document.addEventListener('click', function(e) {
            if(e.target.id === 'enter-btn') return; 
            
            createRipple(e.clientX, e.clientY); 
            createParticles(e.clientX, e.clientY);
            
            const colors = ['#00ff41', '#ff79c6', '#ffb86c'];
            const h = document.createElement('div'); h.className = 'click-heart'; h.innerHTML = '<3';
            h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
            const color = colors[Math.floor(Math.random() * colors.length)];
            h.style.color = color;
            h.style.textShadow = `0 0 15px ${color}`; 
            document.body.appendChild(h); setTimeout(() => h.remove(), 1000);
            
            try { playClickSound(); } catch(err) {}
        });

        function createRipple(x, y) {
            const colors = ['#00ff41', '#ff79c6', '#ffb86c'];
            colors.forEach((color, index) => { 
                setTimeout(() => { 
                    const r = document.createElement('div'); r.className = 'click-ripple'; 
                    r.style.left = x + 'px'; r.style.top = y + 'px'; 
                    r.style.border = `solid ${color}`; 
                    r.style.boxShadow = `0 0 20px ${color}, inset 0 0 10px ${color}`; 
                    document.body.appendChild(r); setTimeout(() => r.remove(), 800); 
                }, index * 120); 
            });
        }
        function createParticles(x, y) {
            const colors = ['#00ff41', '#ff79c6', '#ffb86c'];
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div'); p.className = 'click-particle'; p.style.left = x + 'px'; p.style.top = y + 'px';
                const c = colors[Math.floor(Math.random() * colors.length)]; 
                p.style.backgroundColor = c; p.style.boxShadow = `0 0 10px ${c}`;
                const a = (Math.PI * 2 * i) / 12; const v = 60 + Math.random() * 60; const tx = Math.cos(a) * v; const ty = Math.sin(a) * v;
                p.style.setProperty('--tx', `${tx}px`); p.style.setProperty('--ty', `${ty}px`);
                document.body.appendChild(p); setTimeout(() => p.remove(), 600);
            }
        }

        // MƯA CODE THƯA
        setInterval(() => {
            const p = document.createElement('div'); p.className = 'snowflake'; p.innerHTML = ['</>', '{ }', '[ ]', '( )', '<< >>'][Math.floor(Math.random() * 5)]; p.style.left = Math.random()*100+'vw'; p.style.animationDuration = Math.random() * 4 + 3 + 's';
            document.getElementById('snowContainer').appendChild(p); setTimeout(() => p.remove(), 7000);
        }, 2000);

        /* MÈO ONEKO */
        function initCat(catEl){
          const margin = 16;
          const nekoSpeed = 10;

          const spriteSets = {
            idle: [[-3, -3]],
            alert: [[-7, -3]],
            scratchSelf: [[-5, 0], [-6, 0], [-7, 0]],
            scratchWallN: [[0, 0], [0, -1]],
            scratchWallS: [[-7, -1], [-6, -2]],
            scratchWallE: [[-2, -2], [-2, -3]],
            scratchWallW: [[-4, 0], [-4, -1]],
            tired: [[-3, -2]],
            sleeping: [[-2, 0], [-2, -1]],
            N: [[-1, -2], [-1, -3]],
            NE: [[0, -2], [0, -3]],
            E: [[-3, 0], [-3, -1]],
            SE: [[-5, -1], [-5, -2]],
            S: [[-6, -3], [-7, -2]],
            SW: [[-5, -3], [-6, -1]],
            W: [[-4, -2], [-4, -3]],
            NW: [[-1, 0], [-1, -1]],
          };

          let nekoPosX = window.innerWidth / 2, nekoPosY = window.innerHeight / 2;
          let mousePosX = nekoPosX, mousePosY = nekoPosY;
          let frameCount = 0;
          let idleTime = 0;
          let idleAnimation = null;
          let idleAnimationFrame = 0;
          let mode = 'auto';
          let pointerId = null;
          let ready = false;

          function bounds(){
            return {
              minX: margin,
              maxX: Math.max(margin, window.innerWidth - margin),
              minY: margin,
              maxY: Math.max(margin, window.innerHeight - margin)
            };
          }
          function clampNeko(){
            const b = bounds();
            nekoPosX = Math.min(Math.max(b.minX, nekoPosX), b.maxX);
            nekoPosY = Math.min(Math.max(b.minY, nekoPosY), b.maxY);
          }
          function setSprite(name, frame){
            const set = spriteSets[name] || spriteSets.idle;
            const sprite = set[frame % set.length];
            catEl.style.backgroundPosition = `${sprite[0]*32}px ${sprite[1]*32}px`;
          }
          function render(){
            catEl.style.left = (nekoPosX - 16) + 'px';
            catEl.style.top = (nekoPosY - 16) + 'px';
          }
          function resetIdleAnimation(){ idleAnimation = null; idleAnimationFrame = 0; }

          function idle(){
            idleTime += 1;
            const b = bounds();
            if(idleTime > 10 && Math.floor(Math.random()*200) === 0 && idleAnimation === null){
              const avail = ["sleeping", "scratchSelf"];
              if(nekoPosX < b.minX + 4) avail.push("scratchWallW");
              if(nekoPosY < b.minY + 4) avail.push("scratchWallN");
              if(nekoPosX > b.maxX - 4) avail.push("scratchWallE");
              if(nekoPosY > b.maxY - 4) avail.push("scratchWallS");
              idleAnimation = avail[Math.floor(Math.random()*avail.length)];
            }
            switch(idleAnimation){
              case "sleeping":
                if(idleAnimationFrame < 8){ setSprite("tired", 0); break; }
                setSprite("sleeping", Math.floor(idleAnimationFrame/4));
                if(idleAnimationFrame > 192) resetIdleAnimation();
                break;
              case "scratchWallN":
              case "scratchWallS":
              case "scratchWallE":
              case "scratchWallW":
              case "scratchSelf":
                setSprite(idleAnimation, idleAnimationFrame);
                if(idleAnimationFrame > 9) resetIdleAnimation();
                break;
              default:
                setSprite("idle", 0);
                return;
            }
            idleAnimationFrame += 1;
          }

          function stepFrame(){
            frameCount += 1;
            const diffX = nekoPosX - mousePosX;
            const diffY = nekoPosY - mousePosY;
            const distance = Math.sqrt(diffX**2 + diffY**2);

            if(distance < nekoSpeed || distance < 48){
              idle();
              return;
            }

            idleAnimation = null;
            idleAnimationFrame = 0;

            if(idleTime > 1){
              setSprite("alert", 0);
              idleTime = Math.min(idleTime, 7);
              idleTime -= 1;
              return;
            }

            let direction = "";
            direction += diffY / distance > 0.5 ? "N" : "";
            direction += diffY / distance < -0.5 ? "S" : "";
            direction += diffX / distance > 0.5 ? "W" : "";
            direction += diffX / distance < -0.5 ? "E" : "";
            setSprite(direction || "idle", frameCount);

            nekoPosX -= (diffX / distance) * nekoSpeed;
            nekoPosY -= (diffY / distance) * nekoSpeed;
            clampNeko();
            render();
          }

          requestAnimationFrame(()=>{
            const b = bounds();
            nekoPosX = b.maxX;
            nekoPosY = b.maxY - 10;
            mousePosX = nekoPosX;
            mousePosY = nekoPosY;
            render();
            setSprite("idle", 0);
            ready = true;
          });

          function setMouseFromClient(clientX, clientY){
            mousePosX = clientX;
            mousePosY = clientY;
          }

          document.addEventListener('pointermove', (e)=>{
            if(mode === 'dragging') return;
            setMouseFromClient(e.clientX, e.clientY);
          });
          document.addEventListener('touchstart', (e)=>{
            if(mode === 'dragging') return;
            const t = e.touches[0];
            if(t) setMouseFromClient(t.clientX, t.clientY);
          }, { passive:true });
          document.addEventListener('touchmove', (e)=>{
            if(mode === 'dragging') return;
            const t = e.touches[0];
            if(t) setMouseFromClient(t.clientX, t.clientY);
          }, { passive:true });

          window.addEventListener('resize', clampNeko);

          let lastFrameTimestamp = null;
          function onAnimationFrame(timestamp){
            if(!ready){ requestAnimationFrame(onAnimationFrame); return; }
            if(lastFrameTimestamp === null) lastFrameTimestamp = timestamp;
            if(mode !== 'dragging' && timestamp - lastFrameTimestamp > 100){
              lastFrameTimestamp = timestamp;
              stepFrame();
            }
            requestAnimationFrame(onAnimationFrame);
          }
          requestAnimationFrame(onAnimationFrame);

          catEl.addEventListener('contextmenu', (e)=> e.preventDefault());
          catEl.addEventListener('dragstart', (e)=> e.preventDefault());

          catEl.addEventListener('pointerdown', (e)=>{
            if(!ready) return;
            mode = 'dragging';
            pointerId = e.pointerId;
            catEl.classList.add('dragging');
            catEl.setPointerCapture(pointerId);
            setSprite('alert', 0);
            e.stopPropagation();
            e.preventDefault();
          });
          catEl.addEventListener('pointermove', (e)=>{
            if(mode !== 'dragging') return;
            nekoPosX = e.clientX;
            nekoPosY = e.clientY;
            clampNeko();
            render();
          });
          function endDrag(){
            if(mode !== 'dragging') return;
            mode = 'auto';
            catEl.classList.remove('dragging');
            mousePosX = nekoPosX; mousePosY = nekoPosY;
            idleTime = 0;
            frameCount = 0;
          }
          catEl.addEventListener('pointerup', endDrag);
          catEl.addEventListener('pointercancel', endDrag);
        }

        requestAnimationFrame(()=>{
          const catEl = document.getElementById('decoCat');
          if(catEl) initCat(catEl);
        });
    </script>
